name: WifiMic
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.0"
targets:
  WifiMic:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        NSCameraUsageDescription: "Wi-Fi Mic использует камеру для сканирования QR-кода."
        NSMicrophoneUsageDescription: "Wi-Fi Mic использует микрофон для передачи звука на ПК."
        NSLocalNetworkUsageDescription: "Wi-Fi Mic подключается к ПК по локальной сети."
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.local.wifimic
      ENABLE_BITCODE: NO
      SWIFT_VERSION: "5.9"
      INFOPLIST_FILE: Sources/Info.plist
      GENERATE_INFOPLIST_FILE: YES
      CURRENT_PROJECT_VERSION: 2
      MARKETING_VERSION: "1.1"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Sources/WifiMic.entitlements
