name: WifiMic
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "16.0"
targets:
  WifiMic:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "WifiMic.entitlements"
    info:
      path: Sources/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.local.wifimic
      ENABLE_BITCODE: NO
      SWIFT_VERSION: "5.9"
      INFOPLIST_FILE: Sources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Sources/WifiMic.entitlements
